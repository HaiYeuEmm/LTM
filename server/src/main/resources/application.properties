spring.application.name=online-exam-server
spring.config.import=optional:file:./application-local.properties

# Aiven MySQL connection. Keep DB_PASSWORD in an environment variable; never commit it.
spring.datasource.url=jdbc:mysql://${DB_HOST:mysql-ltm2026-vothanhhai020106-ltm.d.aivencloud.com}:${DB_PORT:18745}/${DB_NAME:ltm}?sslMode=REQUIRED
spring.datasource.username=${DB_USERNAME:avnadmin}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.connection-timeout=10000

# Run the idempotent initial schema when the server starts from the server/ directory.
spring.sql.init.mode=always
spring.sql.init.schema-locations=file:../database/migrations/V1__create_users.sql
